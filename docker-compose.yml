services:
  api:
    build: .
    image: mini-vss
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Both packages importable as top-level (perception/, retrieval/).
      - PYTHONPATH=/app
      # HuggingFace models load from the mounted cache — no re-downloads.
      - HF_HOME=/app/model-cache/huggingface
      - TRANSFORMERS_CACHE=/app/model-cache/huggingface
      - TORCH_HOME=/app/model-cache/torch
      - YOLO_CONFIG_DIR=/app/model-cache/ultralytics
      - DATA_DIR=/app/data
      - CHROMA_DIR=/app/data/chroma
    volumes:
      # Bind mounts: data + weights persist on the HOST, never lost on rebuild.
      - ./data:/app/data                 # uploads, thumbs, chroma
      - ./model-cache:/app/model-cache   # HuggingFace / torch / YOLO weights
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach a host-side Ollama on Linux
    # ── GPU passthrough (optional) ──────────────────────────────
    # Requires NVIDIA drivers + the NVIDIA Container Toolkit on the host. The
    # app auto-detects CUDA and falls back to CPU when absent, so this stays
    # COMMENTED by default — otherwise `docker-compose up` fails on CPU-only
    # hosts with "could not select device driver". Uncomment on a GPU box:
    #
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Next.js UI (unchanged). Talks to the API from the browser on :8000.
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
