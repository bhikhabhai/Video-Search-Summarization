services:
  api:
    build: .
    image: mini-vss
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Both packages importable as top-level (perception/, retrieval/).
      - PYTHONPATH=/app
      # HuggingFace models load from the mounted cache — no re-downloads.
      - HF_HOME=/app/model-cache/huggingface
      - TORCH_HOME=/app/model-cache/torch
      - YOLO_CONFIG_DIR=/app/model-cache/ultralytics
      - DATA_DIR=/app/data
      - CHROMA_DIR=/app/data/chroma
      # Silence ChromaDB's noisy (harmless) telemetry capture() errors.
      - ANONYMIZED_TELEMETRY=False
      # GTX 1650 (4 GB) VRAM management — reduce allocator fragmentation so
      # Qwen + CLIP + YOLO can share 3.62 GB without "unknown error" OOMs.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Make CUDA kernel errors synchronous so stack traces are accurate.
      - CUDA_LAUNCH_BLOCKING=0
    volumes:
      # Bind mounts: data + weights persist on the HOST, never lost on rebuild.
      - ./data:/app/data                 # uploads, thumbs, chroma
      - ./model-cache:/app/model-cache   # HuggingFace / torch / YOLO weights
      # Live code: edit on host, `docker-compose restart api` — no rebuild/reinstall.
      # Only rebuild when requirements.txt changes.
      - ./perception:/app/perception
      - ./retrieval:/app/retrieval
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach a host-side Ollama on Linux
    # ── GPU passthrough ─────────────────────────────────────────
    # NVIDIA Container Toolkit detected on host (GTX 1650, 4 GB VRAM).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Next.js UI (unchanged). Talks to the API from the browser on :8000.
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
